name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      fetch-external-links:
        type: boolean
        description: Check if external links are broken

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 20.x
    - name: Install
      run: yarn install --immutable
    - name: Run markdownlint
      run: yarn markdownlint-cli2 "**/*.md"
    - name: Lint links
      run: yarn lint-roller-markdown-links --ignore-path .markdownlintignore "**/*.md"
      if: ${{ always() }}
    - name: Check external links
      run: yarn lint-roller-markdown-links --ignore-path .markdownlintignore --fetch-external-links "**/*.md"
      if: ${{ inputs.fetch-external-links }}
